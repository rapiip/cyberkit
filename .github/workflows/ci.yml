name: CI

on:
  pull_request:
  push:
    # The repository's default branch is `master`. This filter said `main`, so no
    # push to the default branch ever triggered a run - only pull requests did,
    # and those went unnoticed because the workflow could not be parsed anyway.
    # Update this list if the default branch is ever renamed.
    branches:
      - master

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Audit Dependencies
        run: npm audit --audit-level=moderate

      - name: License Scanning
        # Block scalar, not a plain one. As a plain scalar the ": " inside
        # 'Warning: Restrictive licenses found' terminated the value, so the whole
        # workflow failed to parse and every run completed with zero jobs.
        run: |
          npx license-checker --summary --failOn 'GPL;AGPL;LGPL' || echo 'Warning: Restrictive licenses found'

  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # The Playwright webServer starts `next start` under CI, so the production
      # output has to exist before the suite runs.
      - name: Build
        run: npm run build

      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  secret-scanning:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: TruffleHog Secret Scan
        # Pinned to an immutable commit SHA, not a branch. `@main` meant every CI
        # run executed whatever happened to be on that branch at the time, with
        # access to the repository checkout. Dependabot's github-actions
        # ecosystem now proposes the bumps.
        uses: trufflesecurity/trufflehog@20652fbbdefffcdaa493a5bf57ab2ac6b1db715b # v3.97.1
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD

  sast:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript, typescript
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

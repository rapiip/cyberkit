version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-patch
      - dependency-name: "@types/react"
        update-types:
          - version-update:semver-patch
      - dependency-name: "@types/react-dom"
        update-types:
          - version-update:semver-patch
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
